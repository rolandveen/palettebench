name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python 3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[quality]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest --cov --cov-report=term-missing
      - name: Smoke-test non-default CLI options
        run: palettebench palettes/okabe-ito.yaml --output /tmp/palettebench-smoke --format pdf --severity 20,40

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1.2"
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m pip install dist/*.whl
          cd /tmp
          palettebench --version
          palettebench example --output okabe-ito.yaml
          palettebench okabe-ito.yaml --output wheel-smoke --format svg --severity 100
