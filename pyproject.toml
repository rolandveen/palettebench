[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "palettebench"
version = "0.1.0"
description = "Reproducible perceptual and colour-vision-deficiency audits for scientific palettes"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Roland J. Veen"}]
keywords = ["accessibility", "colour", "color", "palette", "scientific-visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "colorspacious>=1.1.2",
  "colour-science>=0.4.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/rolandveen/palettebench"
Documentation = "https://github.com/rolandveen/palettebench#readme"
Repository = "https://github.com/rolandveen/palettebench"
Issues = "https://github.com/rolandveen/palettebench/issues"

[project.scripts]
palettebench = "palettebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
palettebench = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
